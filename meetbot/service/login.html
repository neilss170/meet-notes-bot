<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Scribe</title>
<style>
  /* The page's paper, ink and one green - see ui.html. */
  :root {
    color-scheme: light;
    --bg: #f7f7f9; --raised: #ffffff; --line: #e6e6ec; --line-2: #d8d8e1;
    --ink: #0f0f14; --ink-2: #4a4a57; --faint: #9a9aa8;
    --accent: #6b5cff; --accent-ink: #ffffff; --bad: #c2412d; --bad-soft: #fbe6e1;
    --iris: linear-gradient(115deg, #7b61ff 0%, #4d8dff 48%, #1fc4a8 100%);
    --focus: color-mix(in srgb, var(--accent) 55%, transparent);
    --shadow: 0 1px 2px rgba(40, 36, 28, .05), 0 18px 50px -20px rgba(40, 36, 28, .25);
    --sans: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont,
            Inter, Roboto, "Helvetica Neue", sans-serif;
    --display: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont,
               Inter, Roboto, "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0b0b0f; --raised: #141419; --line: #21212a; --line-2: #2d2d38;
      --ink: #f3f3f7; --ink-2: #b2b2c0; --faint: #6c6c7a;
      --accent: #a194ff; --accent-ink: #0b0b0f; --bad: #ff8a73; --bad-soft: rgba(255, 138, 115, .13);
      --iris: linear-gradient(115deg, #8f78ff 0%, #5aa2ff 48%, #2fe0bd 100%);
      --shadow: 0 18px 50px -20px rgba(0, 0, 0, .7);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    background: radial-gradient(700px 360px at 50% -10%, color-mix(in srgb, #7b61ff 12%, transparent), transparent 70%), var(--bg);
    font: 14.5px/1.55 var(--sans); -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 360px; padding: 30px 28px 24px; border-radius: 16px;
    background: var(--raised); border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .mark {

  }
  h1 { font: 600 24px/1.2 var(--display); letter-spacing: -0.02em; margin: 0 0 22px; }
  label { display: block; font-size: 13px; font-weight: 550; margin: 0 0 6px; color: var(--ink-2); }
  input {
    width: 100%; padding: 9px 12px; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line-2); border-radius: 9px; margin-bottom: 14px; outline: none;
  }
  input:focus { border-color: var(--focus); }
  button {
    width: 100%; font: inherit; font-weight: 600; height: 38px; margin-top: 4px; border: 0;
    border-radius: 10px; cursor: pointer; background: var(--iris); color: #fff;
    box-shadow: 0 8px 22px -10px rgba(123, 97, 255, .7);
  }
  button:hover { filter: saturate(1.15) brightness(1.04); }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .err {
    color: var(--bad); font-size: 13px; margin-bottom: 16px; padding: 9px 12px;
    border-radius: 9px; background: var(--bad-soft);
  }
  .note {
    color: var(--faint); font-size: 12.5px; margin: 20px 0 0; line-height: 1.55;
  }
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <div class="mark" aria-hidden="true"></div>
    <h1>Sign in to Scribe</h1>

    <!--ERROR-->

    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username"
           autocapitalize="none" spellcheck="false" autofocus required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>

    <button type="submit">Sign in</button>

    <p class="note">No account? Ask an admin to create one.</p>
  </form>
</body>
</html>
