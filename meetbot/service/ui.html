  return String(text).split(/(\s+)/).map((part) => {
    if (!part) return "";
    if (!part.trim()) return " ";
    const delay = Math.min(index++ * 34, 1100);
    return `<span class="w-in" style="--d:${delay}ms">${esc(part)}</span>`;
  }).join("");
}

function lineHtml(line, cited, animate) {
  return (
    `<div class="live-line${cited ? " cited" : ""}" data-start="${esc(line.start)}">` +
      `<span class="t">${esc(mmss(line.start))}</span>` +
      `<span class="w">${esc(line.speaker)}</span>` +
      `<span class="x">${animate ? wordsHtml(line.text) : esc(line.text)}</span>` +
    "</div>"
  );
}

function renderTranscript(rebuild) {
  const pane = $("pane");
  const job = state.detail;
  if (!pane || !job) return;
  const have = state.full.id === job.id;
  const live = !["finished", "failed"].includes(job.status);
  // A finished meeting is read once. A live one is re-read as it grows -
  // often enough that words land moments after they are registered.
  // Re-read when the transcript has grown - or when a moment was marked,
  // which changes nothing else about the meeting and would otherwise never
  // reach the page.
  const changed = have && (state.full.count !== (job.utterance_count || 0) ||
    (state.full.marks || []).length !== (job.mark_count || 0));
  const grown = changed && live && Date.now() - state.full.at > 1500;
  if (!state.full.loading && (!have || grown)) loadTranscript();

  if (rebuild || !$("tx-lines")) {
    pane.innerHTML =
      '<div class="transcript">' +
        '<div class="speakerbar" id="tx-speakers" hidden></div>' +
        '<div id="tx-lines"></div>' +
        '<div class="tx-foot" id="tx-foot" hidden></div>' +
      "</div>";
    state.tx = { id: null, texts: [], registeringUntil: 0, lastNewAt: Date.now() };
    state.sig.transcript = "";
  }

  const lines = have ? state.full.segments : [];
  const jump = have && state.jump && state.jump.id === job.id ? state.jump : null;
  const signature = `${job.id}:${have}:${lines.length}:` +
    `${lines.length ? lines[lines.length - 1].text.length : 0}:` +
    `${(state.full.marks || []).length}`;
  if (jump || signature !== state.sig.transcript) {
    state.sig.transcript = signature;
    paintTranscript(pane, job, lines, have, live, jump);
  }
  markMoments();
  renderSpeakers(job);
  updateListening(job);
}

/* A live transcript is painted incrementally: new words come into focus
   where they land, and nothing already on screen is redrawn - redrawing
   would restart every animation and lose the reader's place. */
function paintTranscript(pane, job, lines, have, live, jump) {
  const host = $("tx-lines");
  if (!have) {
    host.innerHTML = live ? "" : '<div class="placeholder"><span class="spin"></span></div>';
    return;
  }
  if (!lines.length) {
    state.tx.id = job.id;
    state.tx.texts = [];
    host.innerHTML = live ? "" :
      '<div class="placeholder">Nothing was transcribed in this meeting.</div>';
    return;
  }

  const atBottom = live && pane.scrollHeight - pane.scrollTop - pane.clientHeight < 80;
  const cited = state.cited && state.cited.id === job.id ? state.cited.start : null;
  const shown = state.tx.id === job.id ? state.tx.texts : null;
  // Opening a transcript shows it; only what arrives afterwards is animated.
  const animate = live && shown !== null;
  const rows = host.querySelectorAll(".live-line");
  const grows = shown !== null && rows.length === shown.length && shown.length <= lines.length &&
    shown.every((text, i) =>
      i === shown.length - 1 ? lines[i].text.startsWith(text) : lines[i].text === text);
  let added = 0;

  if (grows) {
    const last = shown.length - 1;
    if (last >= 0 && lines[last].text !== shown[last]) {
      const more = lines[last].text.slice(shown[last].length).trim();
      if (more) {
        rows[last].querySelector(".x").insertAdjacentHTML("beforeend", " " + wordsHtml(more));
        added += 1;
      }
    }
    const fresh = lines.slice(shown.length);
    if (fresh.length) {
      host.insertAdjacentHTML("beforeend",
        fresh.map((line) => lineHtml(line, line.start === cited, animate)).join(""));
      added += fresh.length;
    }
  } else {
    // Something earlier changed - a second channel finalised a line that
    // belongs before ones already shown. Repaint, animating only what is new.
    const before = new Set(shown || []);
    host.innerHTML = lines.map((line) => {
      const isNew = animate && !before.has(line.text);
      if (isNew) added += 1;
      return lineHtml(line, line.start === cited, isNew);
    }).join("");
  }
  state.tx.id = job.id;
  state.tx.texts = lines.map((line) => line.text);
  if (added && animate) {
    state.tx.registeringUntil = Date.now() + 1800;
    state.tx.lastNewAt = Date.now();
    setTimeout(() => { if (state.detail && state.tab === "transcript") updateListening(state.detail); }, 1900);
  }

  if (jump) {
    // The nearest line rather than an exact match: a live meeting's lines
    // can merge between the answer being written and it being opened.
    state.jump = null;
    const all = [...host.querySelectorAll(".live-line")];
    let best = all[0];
    let distance = Infinity;
    for (const row of all) {
      const gap = Math.abs(Number(row.dataset.start) - jump.start);
      if (gap < distance) { best = row; distance = gap; }
    }
    all.forEach((row) => row.classList.remove("cited"));
    best.classList.add("cited", "flash");
    state.cited = { id: job.id, start: Number(best.dataset.start) };
    best.scrollIntoView({ block: "center" });
    return;
  }
  // Follow a live meeting, but do not yank the page from under someone who
  // has scrolled up to re-read something.
  if (atBottom) pane.scrollTop = pane.scrollHeight;
}

/** Put the marks somebody asked for onto the lines nearest them.

    The nearest line rather than an exact one: "mark this" is said a beat
    after the thing worth marking, and the timestamp is whatever the
    recording had reached. */
function markMoments() {
  const host = $("tx-lines");
  if (!host) return;
  host.querySelectorAll(".live-line.marked").forEach((row) => {
    row.classList.remove("marked");
  });
  const marks = state.full.marks || [];
  const rows = [...host.querySelectorAll(".live-line")];
  if (!marks.length || !rows.length) return;
  for (const at of marks) {
    let best = rows[0];
    let distance = Infinity;
    for (const row of rows) {
      const gap = Math.abs(Number(row.dataset.start) - at);
      if (gap < distance) { best = row; distance = gap; }
    }
    best.classList.add("marked");
  }
}

/* Diarization can only say that two different people spoke. One person who
   was there can say who they were, once, and every line, note and citation
   carries the name from then on. */

function renderSpeakers(job) {
  const bar = $("tx-speakers");
  if (!bar) return;
  const voices = state.full.id === job.id ? (state.full.speakers || []) : [];
  bar.hidden = !voices.length;
  if (!voices.length) return;

  const signature = JSON.stringify(voices) + `:${state.naming}:${state.namingError}`;
  if (signature === state.sig.speakers) return;
  state.sig.speakers = signature;

  bar.innerHTML =
    '<span class="sb-label">Voices</span>' +
    voices.map((voice) => {
      const named = voice.name !== voice.id;
      if (state.naming === voice.id) {
        return '<input class="sb-input" id="sb-edit" spellcheck="false" maxlength="60" ' +
          `data-id="${esc(voice.id)}" value="${esc(named ? voice.name : "")}" ` +
          `placeholder="Who was ${esc(voice.id)}?">`;
      }
      return `<button class="sb-chip${named ? "" : " unnamed"}" data-id="${esc(voice.id)}" ` +
        `title="Say who this was">${esc(voice.name)}</button>`;
    }).join("") +
    (state.namingError ? `<span class="sb-err">${esc(state.namingError)}</span>` : "");

  bar.querySelectorAll(".sb-chip").forEach((el) => {
    el.addEventListener("click", () => {
      state.naming = el.dataset.id;
      state.namingError = "";
      renderSpeakers(job);
      const box = $("sb-edit");
      if (box) { box.focus(); box.select(); }
    });
  });

  const box = $("sb-edit");
  if (!box) return;
  box.addEventListener("keydown", (event) => {
    if (event.key === "Enter") { event.preventDefault(); saveSpeaker(box.dataset.id, box.value); }
    if (event.key === "Escape") { state.naming = null; renderSpeakers(job); }
  });
  // Clicking away saves rather than discarding: losing a name somebody just
  // typed because they reached for the mouse would be its own small betrayal.
  box.addEventListener("blur", () => {
    if (state.naming === box.dataset.id) saveSpeaker(box.dataset.id, box.value);
  });
}

async function saveSpeaker(id, value) {
  const job = state.detail;
  if (!job) return;
  const voices = state.full.speakers || [];
  const current = (voices.find((voice) => voice.id === id) || {}).name || id;
  const wanted = value.trim();
  state.naming = null;
  state.namingError = "";
  if ((wanted || id) === current) { renderSpeakers(job); return; }
  try {
    const result = await api(`/api/meetings/${job.id}/speakers`, {
      method: "PUT", body: JSON.stringify({ names: { [id]: wanted } }),
    });
    state.full.speakers = result.speakers || [];
    // Every line that carried the old label has just been renamed.
    state.full.count = -1;
    state.tx.id = null;
    state.sig.transcript = "";
    await loadTranscript();
  } catch (error) {
    state.namingError = error.message;
  }
  if (state.detail) renderSpeakers(state.detail);
}

/** The spark at the foot of a live transcript, and what it says. */
function updateListening(job) {
  const foot = $("tx-foot");
  if (!foot) return;
  const live = !["finished", "failed"].includes(job.status);
  const hasLines = !!document.querySelector("#tx-lines .live-line");
  foot.hidden = !live;
  foot.parentElement.classList.toggle("empty", live && !hasLines);
  if (!live) return;

  let word = LISTENING[job.status] || "Listening";
  if (job.status === "in_call") {
    const now = Date.now();
    if (now < state.tx.registeringUntil) word = "Registering";
    else if (state.tx.lastNewAt && now - state.tx.lastNewAt > 60000) word = "Still listening";
  }
  if (!foot.firstElementChild) {
    foot.innerHTML = thinkingHtml(word) +
      '<span class="tx-hint">Words appear here a moment after somebody speaks.</span>';
  }
  foot.querySelector(".tx-hint").hidden = hasLines;
  swapWord(foot.querySelector(".thinking-word"), word);
}

/* ------------------------------------------------------------------ ask */

const SUGGESTIONS = [
  "What did I miss?",
  "What was decided?",
  "List every action item and who owns it",
  "What questions were left unanswered?",
];

const citeSwitch = (title) =>
  `<label class="switch" title="${esc(title)}">` +
    `<input type="checkbox" class="cite-switch"${state.citations ? " checked" : ""}>` +
    '<span class="track"></span><span>Citations</span>' +
  "</label>";

function renderAsk(rebuild) {
  const pane = $("pane");
  if (!pane) return;
  const turns = state.pad?.chat || [];
  const signature = `${turns.length}:${state.asking}:${state.citations}`;
  if (!rebuild && signature === state.sig.chat) return;
  state.sig.chat = signature;

  const draft = $("ask-input")?.value || "";
  const atBottom = pane.scrollHeight - pane.scrollTop - pane.clientHeight < 120;
  pane.innerHTML =
    '<div class="askwrap">' +
      '<div class="askfeed">' +
        (turns.length
          // Oldest first, like a conversation - the newest answer sits
          // directly above the composer you just typed into.
          ? turns.map((turn, index) => turnHtml(turn, index, false)).join("")
          : '<div class="placeholder">Answers come only from this meeting’s ' +
            "transcript and notes, and link to the lines they came from.<br>" +
            "If it wasn’t said, Scribe will say so rather than guess.</div>") +
        (state.asking
          ? '<div class="turn">' +
              thinkingHtml(["Reading the meeting", "Finding the lines", "Writing the answer"]) +
            "</div>"
          : "") +
        '<div class="err" id="ask-error" hidden></div>' +
      "</div>" +
      (turns.length ? "" :
        '<div class="suggest">' +
        SUGGESTIONS.map((q) => `<button data-q="${esc(q)}">${esc(q)}</button>`).join("") +
        "</div>") +
      '<div class="askbar">' +
        '<input type="text" id="ask-input" class="grow" placeholder="Ask anything about this meeting…" autocomplete="off">' +
        `<button class="btn primary" id="ask-go"${state.asking ? " disabled" : ""}>` +
        (state.asking ? '<span class="spark" aria-hidden="true"></span>' : "Ask") + "</button>" +
      "</div>" +
      '<div class="row ask-tools">' +
        citeSwitch("Link each answer to the lines it came from") +
        '<span class="grow"></span>' +
        (turns.length ? '<button class="btn sm quiet" id="ask-clear">Clear</button>' : "") +
      "</div>" +
    "</div>";

  wireCitations(pane, turns, false);
  const input = $("ask-input");
  input.value = draft;
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); runAsk(); }
  });
  $("ask-go").addEventListener("click", runAsk);
  pane.querySelectorAll(".suggest button").forEach((el) => {
    el.addEventListener("click", () => { $("ask-input").value = el.dataset.q; runAsk(); });
  });
  const clear = $("ask-clear");
  if (clear) clear.addEventListener("click", clearChat);
  if (!state.asking && rebuild) input.focus();
  if (atBottom || rebuild) pane.scrollTop = pane.scrollHeight;
}

async function runAsk() {
  const input = $("ask-input");
  if (!input || state.asking) return;
  const question = input.value.trim();
  if (!question) return;
  state.asking = true;
  state.sig.chat = "";
  renderAsk(false);
  try {
    const turn = await api(`/api/meetings/${state.selected}/ask`, {
      method: "POST", body: JSON.stringify({ question }),
    });
    if (state.pad) state.pad.chat.push(turn);
    state.asking = false;
    state.sig.chat = "";
    renderAsk(false);
    const box = $("ask-input");
    if (box) box.value = "";
  } catch (error) {
    state.asking = false;
    state.sig.chat = "";
    renderAsk(false);
    const box = $("ask-error");
    if (box) { box.textContent = error.message; box.hidden = false; }
  }
}

async function clearChat() {
  try {
    await api(`/api/meetings/${state.selected}/chat`, { method: "DELETE" });
    if (state.pad) state.pad.chat = [];
    state.sig.chat = "";
    renderAsk(false);
  } catch (error) { showError(error.message); }
}

/* ------------------------------------------------------ ask every meeting */

const CHAT_SUGGESTIONS = [
  "What did I commit to this week?",
  "When did we last talk about deadlines?",
  "Which meeting mentioned the budget?",
];

function setChatOpen(open, { focus = false } = {}) {
  state.chatOpen = open;
  prefs.set("scribe.chatOpen", open);
  $("app").classList.toggle("chat-closed", !open);
  $("chat-toggle").classList.toggle("on", open);
  if (!open) closeCiteCard();
  if (open && !state.chat.loaded) loadChat();
  if (open && focus) $("chat-input").focus();
}

async function loadChat() {
  try {
    const data = await api("/api/chat");
    state.chat.turns = data.chat || [];
  } catch (error) {
    if (String(error.message).includes("signed out")) return;
    state.chat.error = error.message;
  }
  state.chat.loaded = true;
  renderChat(true);
}

function renderChat(scrollToEnd) {
  const feed = $("chat-feed");
  const chat = state.chat;
  const signature = `${chat.loaded}:${chat.turns.length}:${chat.asking}:${state.citations}:${chat.error}`;
  if (signature === chat.sig) return;
  chat.sig = signature;
  const scroll = feed.scrollTop;

  if (!chat.loaded) {
    feed.innerHTML = '<div class="placeholder"><span class="spin"></span></div>';
    return;
  }
  feed.innerHTML =
    (chat.turns.length
      ? chat.turns.map((turn, index) => turnHtml(turn, index, true)).join("")
      : chat.asking ? "" :
        '<div class="chat-empty">' +
          '<span class="spark" aria-hidden="true"></span>' +
          "<h4>Ask across every meeting</h4>" +
          "<p>Find what was said, who said it, and in which meeting. Every " +
          "answer links back to the moment it came from.</p>" +
          '<div class="suggest">' +
          CHAT_SUGGESTIONS.map((q) => `<button data-q="${esc(q)}">${esc(q)}</button>`).join("") +
          "</div>" +
        "</div>") +
    (chat.asking
      ? '<div class="turn">' +
          `<div class="q">${esc(chat.pending)}</div>` +
          thinkingHtml(["Searching your meetings", "Reading transcripts",
                        "Finding the moment", "Writing the answer"]) +
        "</div>"
      : "") +
    (chat.error ? `<div class="err">${esc(chat.error)}</div>` : "");

  wireCitations(feed, chat.turns, true);
  feed.querySelectorAll(".suggest button").forEach((el) => {
    el.addEventListener("click", () => askEverything(el.dataset.q));
  });
  $("chat-clear").hidden = !chat.turns.length;
  $("chat-go").disabled = chat.asking;
  feed.scrollTop = scrollToEnd ? feed.scrollHeight : scroll;
}

async function askEverything(preset) {
  const input = $("chat-input");
  const question = String(preset ?? input.value).trim();
  if (!question || state.chat.asking) return;
  state.chat.asking = true;
  state.chat.pending = question;
  state.chat.error = "";
  input.value = "";
  autoGrow(input);
  renderChat(true);
  try {
    const turn = await api("/api/chat", { method: "POST", body: JSON.stringify({ question }) });
    state.chat.turns.push(turn);
  } catch (error) {
    state.chat.error = error.message;
    // Hand the question back rather than making them type it again.
    if (!input.value) { input.value = question; autoGrow(input); }
  } finally {
    state.chat.asking = false;
    renderChat(true);
  }
}

async function clearEverythingChat() {
  try {
    await api("/api/chat", { method: "DELETE" });
    state.chat.turns = [];
    state.chat.error = "";
    renderChat(true);
  } catch (error) { showError(error.message); }
}

const autoGrow = (el) => {
  el.style.height = "auto";
  el.style.height = `${Math.min(el.scrollHeight, 132)}px`;
};

/* -------------------------------------------------------------- summary */

async function renderSummary(rebuild) {
  const pane = $("pane");
  if (!pane || !rebuild) return;
  pane.innerHTML = '<div class="placeholder"><span class="spin"></span></div>';
  try {
    const text = await api(`/api/meetings/${state.selected}/artifact/analysis.md`);
    pane.innerHTML = `<div class="doc" style="max-width:820px">${renderMarkdown(text)}</div>`;
  } catch (error) {
    pane.innerHTML = `<div class="err">${esc(error.message)}</div>`;
  }
}

/* ----------------------------------------------------------- call alerts */

async function pollCalls() {
  if (!state.me || state.me.role !== "admin") return;
  try {
    const data = await api("/api/calls");
    Object.assign(state.calls, {
      enabled: !!data.enabled, detail: data.detail || "",
      prompts: data.prompts || [], muted: data.muted || [],
    });
  } catch (_) { return; }
  followCallLink();
  renderCallCard();
  renderCallSettings();
  pollVoice();
}

/* An open microphone is worth being able to see. The page says what Scribe is
   listening for and what it last heard, so "it did not hear me" and "it is not
   listening" stop looking like the same thing. */
async function pollVoice() {
  try {
    const data = await api("/api/voice");
    Object.assign(state.voice, {
      enabled: !!data.enabled, listening: !!data.listening,
      detail: data.detail || "", phrases: data.phrases || {}, heard: data.heard || null,
    });
  } catch (_) { return; }
  renderVoice();
}

/* What to do about something heard and not acted on. Three problems, three
   answers, and they are not interchangeable: one says repeat yourself, one
   says finish the sentence, one says say something else. */
const VOICE_TROUBLE = {
  unsure: "Heard that, but not clearly enough to be sure. Say it again, a " +
    "little slower and closer to the microphone.",
  "no-title": "Heard the opening but no name after it \u2014 say the whole " +
    "thing in one breath.",
  unknown: "That is not one of the phrases above.",
};

/* The advice is about something said a moment ago. Left on screen it reads as
   a state rather than an event, and an hour later it is telling somebody to
   repeat a sentence they have long forgotten. So it goes, and the line it
   leaves behind - what was heard, and when - is the useful half anyway: a
   time from this morning and nothing since says more about a dead microphone
   than any message could. */
const VOICE_FRESH_S = 120;

const agoWords = (epoch) => {
  const seconds = Math.max(0, Math.round(Date.now() / 1000 - (epoch || 0)));
  if (seconds < 10) return "just now";
  if (seconds < 60) return `${seconds}s ago`;
  if (seconds < 5400) return `${Math.round(seconds / 60)} min ago`;
  if (seconds < 86400) return `${Math.round(seconds / 3600)}h ago`;
  return "more than a day ago";
};

function renderVoice() {
  const box = $("voice-opts");
  if (!box) return;
  const voice = state.voice;
  box.hidden = !voice.enabled && !voice.detail;
  const heard = voice.heard;
  const age = heard ? Math.round(Date.now() / 1000 - (heard.at || 0)) : 0;
  // The age is in the signature, coarsely, so the line keeps up without
  // being rebuilt on every two-second poll.
  const signature = `${voice.enabled}:${voice.listening}:${voice.detail}:` +
    `${heard ? heard.at : ""}:${Math.floor(age / 30)}`;
  if (signature === voice.sig) return;
  voice.sig = signature;

  const said = Object.values(voice.phrases || {});
  $("voice-detail").innerHTML = voice.listening
    ? esc(voice.detail) + (said.length
        ? "<br>Also: " + said.slice(1).map((phrase) => `&ldquo;${esc(phrase)}&rdquo;`).join(", ")
        : "")
    : esc(voice.detail);

  // A command dropped in silence looks exactly like a microphone that is not
  // working, so anything heard and not acted on says so - and says which of
  // several different things went wrong, while that is still worth knowing.
  const trouble = heard && heard.acted === false && age <= VOICE_FRESH_S
    ? VOICE_TROUBLE[heard.reason] || VOICE_TROUBLE.unknown
    : "";
  $("voice-heard").innerHTML = heard
    ? `Last heard &ldquo;${esc(heard.text)}&rdquo; ` +
      `<span class="src">${Math.round((heard.confidence || 0) * 100)}%</span>` +
      // Outside .src, which uppercases - right for a source label, shouty
      // for a time.
      ` &middot; ${esc(agoWords(heard.at))}` +
      (trouble
        ? `<br><span class="hint bad" style="padding:0;margin:0">${trouble}</span>`
        : "")
    : "";
}

/** A notification's "Start recording" opens the page with the call's id.
    Only a call still waiting here is acted on - the id is random and lives
    only in the notification and behind the login, so a link from anywhere
    else matches nothing. */
function followCallLink() {
  const link = state.callLink;
  if (!link) return;
  state.callLink = null;
  const prompt = state.calls.prompts.find((p) => p.id === (link.record || link.call));
  if (!prompt) {
    showError("That call has already ended, or was answered somewhere else.");
    return;
  }
  if (link.record) recordCall(prompt, prompt.title);
}

function renderCallCard() {
  const root = $("call-root");
  const waiting = state.calls.prompts.filter((p) => !state.callsAnswered.has(p.id));
  const prompt = waiting[0];
  document.title = prompt ? "● Call detected · Scribe" : "Scribe";
  const signature = prompt
    ? `${prompt.id}:${prompt.title}:${waiting.length}:${state.callBusy}` : "";
  if (signature === state.calls.sig) return;
  state.calls.sig = signature;
  if (!prompt) { root.innerHTML = ""; return; }

  // A relabelled prompt (the tab finished loading) must not wipe a name the
  // person has already started typing.
  const typed = root.querySelector(".call-name");
  const keep = typed && typed.dataset.id === prompt.id && typed.dataset.edited ? typed.value : null;
  const heading = `${prompt.service || prompt.app} call detected`;
  const since = prompt.since ? ` since ${clock(prompt.since)}` : "";
  root.innerHTML =
    '<div class="callcard float" role="alertdialog" aria-label="Call detected">' +
      '<span class="ring" aria-hidden="true"></span>' +
      '<div class="call-body">' +
        `<div class="call-title">${esc(heading)}</div>` +
        `<div class="call-sub">${esc(prompt.app)} is using your microphone${esc(since)}. ` +
          "Record it here &mdash; nothing joins the call.</div>" +
        `<input type="text" class="call-name" data-id="${esc(prompt.id)}" ` +
          `value="${esc(keep ?? prompt.title)}" aria-label="Name this recording" autocomplete="off">` +
        '<div class="call-actions">' +
          `<button class="btn sm primary" data-act="record"${state.callBusy ? " disabled" : ""}>` +
            (state.callBusy ? '<span class="spin"></span> Starting' : "Start recording") + "</button>" +
          '<button class="btn sm ghost" data-act="dismiss">Not now</button>' +
          `<button class="btn sm quiet" data-act="mute">Don’t ask for ${esc(prompt.app)}</button>` +
          (waiting.length > 1 ? `<span class="call-more">+${waiting.length - 1} more</span>` : "") +
        "</div>" +
      "</div>" +
    "</div>";
  if (keep !== null) root.querySelector(".call-name").dataset.edited = "1";

  const name = root.querySelector(".call-name");
  name.addEventListener("input", () => { name.dataset.edited = "1"; });
  name.addEventListener("keydown", (event) => {
    if (event.key === "Enter") recordCall(prompt, name.value.trim());
  });
  root.querySelector('[data-act="record"]').addEventListener("click",
    () => recordCall(prompt, name.value.trim()));
  root.querySelector('[data-act="dismiss"]').addEventListener("click", () => dismissCall(prompt));
  root.querySelector('[data-act="mute"]').addEventListener("click", () => muteCallApp(prompt.app_id));
}

async function recordCall(prompt, title) {
  if (state.callBusy || state.sending) return;
  state.callBusy = true;
  state.calls.sig = "";
  renderCallCard();
  try {
    const job = await api("/api/recordings", {
      method: "POST",
      body: JSON.stringify({ title: title || prompt.title, call_id: prompt.id }),
    });
    state.callsAnswered.add(prompt.id);
    await poll();
    await select(job.id);
  } catch (error) {
    showError(error.message);
  } finally {
    state.callBusy = false;
    state.calls.sig = "";
    renderCallCard();
  }
}

async function dismissCall(prompt) {
  state.callsAnswered.add(prompt.id);
  renderCallCard();
  try {
    await api(`/api/calls/${encodeURIComponent(prompt.id)}/dismiss`, { method: "POST" });
  } catch (_) { /* it ended on its own; nothing to undo */ }
}

async function muteCallApp(appId) {
  try {
    const data = await api("/api/calls/mute", {
      method: "POST", body: JSON.stringify({ app_id: appId }),
    });
    state.calls.muted = data.muted || [];
    state.calls.prompts = state.calls.prompts.filter((p) => p.app_id !== appId);
  } catch (error) { showError(error.message); }
  renderCallCard();
  renderCallSettings();
}

async function unmuteCallApp(appId) {
  try {
    const data = await api("/api/calls/unmute", {
      method: "POST", body: JSON.stringify({ app_id: appId }),
    });
    state.calls.muted = data.muted || [];
  } catch (error) { showError(error.message); }
  renderCallSettings();
}

function renderCallSettings() {
  const box = $("call-opts");
  const admin = !!state.me && state.me.role === "admin";
  box.hidden = !admin;
  if (!admin) return;
  const signature = JSON.stringify([state.calls.enabled, state.calls.detail, state.calls.muted]);
  if (signature === state.calls.settingsSig) return;
  state.calls.settingsSig = signature;
  $("call-detail").textContent = state.calls.enabled
    ? "When any app starts using your microphone - Meet, WhatsApp, Zoom, " +
      "Teams, anything - Scribe offers to record it."
    : state.calls.detail;
  const list = $("muted-apps");
  list.innerHTML = state.calls.muted.map((m) =>
    '<div class="muted-app">' +
      `<span>Not asking for ${esc(m.app)}</span>` +
      `<button class="btn sm quiet" data-unmute="${esc(m.app_id)}">Ask again</button>` +
    "</div>").join("");
  list.querySelectorAll("[data-unmute]").forEach((el) => {
    el.addEventListener("click", () => unmuteCallApp(el.dataset.unmute));
  });
}

/* --------------------------------------------------------------- health */

function renderHealth() {
  const host = $("health");
  const report = state.health;
  if (!report) { host.innerHTML = ""; return; }

  // Anything still failing is worth showing, even when something else works -
  // otherwise "the bot is signed out" is invisible until you try to use it.
  const failed = (report.checks || []).filter((c) => !c.ok);
  if (!failed.length) { host.innerHTML = ""; return; }
  const first = failed[0];

  /* A readiness check ages. Reporting an hour-old failure as current is how
     signing the bot back in appeared not to work - the fix was already in
     place and the page was still quoting the check from before it. */
  const mins = report.age_s == null ? null : Math.floor(report.age_s / 60);
  const when = mins == null ? ""
    : mins < 1 ? "checked just now"
    : mins === 1 ? "checked a minute ago"
    : `checked ${mins} minutes ago`;

  host.innerHTML =
    `<div class="banner glass ${report.stale ? "warn" : "bad"}">` +
      `<strong>${esc(first.name)}:</strong> <span>${esc(first.detail)}</span>` +
      (first.fix ? `<code>${esc(first.fix)}</code>` : "") +
      (report.stale
        ? '<span class="hint" style="margin:0">This may be out of date &mdash; ' +
          `${esc(when)}.</span>`
        : (when ? `<span class="hint" style="margin:0">${esc(when)}</span>` : "")) +
      '<span class="grow"></span>' +
      '<button class="btn sm ghost" id="recheck">Re-check</button>' +
    "</div>";

  $("recheck").addEventListener("click", async () => {
    const button = $("recheck");
    button.disabled = true;
    button.innerHTML = '<span class="spin"></span> Checking';
    try { state.health = await api("/api/health/refresh", { method: "POST" }); }
    catch (error) { showError(error.message); }
    renderHealth();
  });
}

/* ------------------------------------------------------------- commands */

async function select(jobId) {
  if (jobId === state.selected) return;
  flushNotes();
  closeCiteCard();
  state.selected = jobId;
  state.detail = null;
  state.pad = null;
  state.padLoadedFor = null;
  state.saveState = "";
  state.tab = "notes";
  state.cited = null;
  state.tx = { id: null, texts: [], registeringUntil: 0, lastNewAt: 0 };
  state.sig = { list: state.sig.list, head: "", transcript: "", enhanced: "",
                chat: "", speakers: "" };
  state.sig.list = "";
  renderSidebar();
  await refreshSelected();
  renderMain();
}

async function refreshSelected() {
  if (!state.selected) return;
  try {
    const [detail, pad] = await Promise.all([
      api(`/api/meetings/${state.selected}`),
      api(`/api/meetings/${state.selected}/notepad`),
    ]);
    state.detail = detail;
    // Never overwrite notes the user is editing with the copy from disk.
    const editing = state.saveState === "editing" || state.saveState === "saving";
    state.pad = editing && state.pad ? { ...pad, notes: state.pad.notes } : pad;
  } catch (error) {
    if (!String(error.message).includes("signed out")) showError(error.message);
  }
}

async function sendBot() {
  if (state.sending) return;
  const url = $("url").value.trim();
  if (!url) { showError("Paste a Meet link first."); return; }
  state.sending = true;
  $("send").disabled = true;
  $("send").innerHTML = '<span class="spin"></span> Sending';
  showError("");
  try {
    const job = await api("/api/meetings", {
      method: "POST",
      body: JSON.stringify({
        meet_url: url,
        speaker_names_from_captions: $("opt-names").checked,
        live_captions_overlay: $("opt-overlay").checked,
        anonymise_analysis: $("opt-anon").checked,
      }),
    });
    $("url").value = "";
    await poll();
    await select(job.id);
  } catch (error) {
    showError(error.message);
  } finally {
    state.sending = false;
    $("send").disabled = false;
    $("send").textContent = "Send bot";
  }
}

async function startRecording() {
  if (state.sending) return;
  state.sending = true;
  const button = $("record");
  button.disabled = true;
  button.innerHTML = '<span class="spin"></span> Starting';
  showError("");
  try {
    const job = await api("/api/recordings", {
      method: "POST",
      body: JSON.stringify({ title: $("rec-title").value.trim() }),
    });
    $("rec-title").value = "";
    await poll();
    await select(job.id);
  } catch (error) {
    showError(error.message);
  } finally {
    state.sending = false;
    button.disabled = false;
    button.textContent = "Start recording";
  }
}

/** Say up front whether this machine can be recorded, and from what. */
async function checkAudio() {
  const hint = $("audio-hint");
  try {
    const info = await api("/api/audio-devices");
    hint.classList.toggle("bad", !info.ready);
    if (!info.ready) {
      hint.textContent = info.detail;
      $("record").disabled = true;
      return;
    }
    const speakers = (info.speakers[0] || {}).name || "your speakers";
    hint.textContent =
      `Captures ${speakers} and your microphone. Nothing joins the call.`;
  } catch (error) {
    hint.textContent = "";
  }
}

/** Rename the open meeting in place: click the title, type, press Enter.

    The poll loop is told to leave the header alone while this is open - see
    renderMain - because a rebuild two seconds in would take the input away
    mid-word. */
function startRename() {
  const heading = $("m-title");
  const job = state.detail;
  if (!heading || !job || state.renaming) return;
  state.renaming = true;

  const was = meetingName(job);
  const box = document.createElement("input");
  box.id = "m-title-input";
  box.className = "title-edit";
  box.value = was;
  box.maxLength = 120;
  box.setAttribute("aria-label", "Meeting name");
  heading.replaceWith(box);
  box.focus();
  box.select();

  const finish = async (save) => {
    if (!state.renaming) return;
    state.renaming = false;
    const wanted = box.value.trim();
    if (save && wanted && wanted !== was) {
      try {
        const updated = await api(`/api/meetings/${job.id}/title`, {
          method: "PUT", body: JSON.stringify({ title: wanted }),
        });
        for (const row of state.meetings) {
          if (row.id === job.id) { row.title = updated.title; row.meet_url = updated.meet_url; }
        }
        if (state.detail && state.detail.id === job.id) {
          state.detail.title = updated.title;
          state.detail.meet_url = updated.meet_url;
        }
      } catch (error) {
        showError(error.message);
      }
    }
    state.sig.head = "";
    state.sig.list = "";
    renderSidebar();
    renderMain();
  };

  box.addEventListener("keydown", (event) => {
    if (event.key === "Enter") { event.preventDefault(); finish(true); }
    else if (event.key === "Escape") { event.preventDefault(); finish(false); }
  });
  // Clicking away commits, the way the notepad saves - losing a rename to a
  // stray click would be a small, avoidable annoyance.
  box.addEventListener("blur", () => finish(true));
}

/* ---------------------------------------------------------------- export */

/* Nothing here asks the server for anything it has not already written, and
   nothing leaves this machine. The notes are in the notepad the page is
   already holding; the transcript and the summary are files on disk, fetched
   only when somebody asks for them. Markdown because it is the one format
   that pastes into Slack, Notion, a doc or a mail with its headings intact. */

const ARTIFACT_OF = { transcript: "transcript.md", summary: "analysis.md" };

/** Which of the four choices this meeting can actually offer. */
const hasPiece = (job, what) =>
  what === "transcript" ? !!job.has_transcript
  : what === "summary" ? !!job.has_summary
  : true;

const stamped = (epoch) => epoch
  ? new Date(epoch * 1000).toLocaleString([], {
      weekday: "short", day: "numeric", month: "short", year: "numeric",
      hour: "numeric", minute: "2-digit",
    })
  : "";

/** A filename that sorts by date and says what it is without being opened. */
function exportName(job, what) {
  const when = new Date((job.created_at || 0) * 1000);
  const pad2 = (n) => String(n).padStart(2, "0");
  const day = job.created_at
    ? `${when.getFullYear()}-${pad2(when.getMonth() + 1)}-${pad2(when.getDate())}-`
    : "";
  const name = meetingName(job).toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 48) || "meeting";
  return `${day}${name}${what === "notes" ? "" : "-" + what}.md`;
}

/** The heading every export opens with, so a pasted note carries its own
    provenance: which meeting, when, how long, and where it was recorded. */
function exportHead(job, label) {
  const where = job.kind === "local"
    ? "recorded on this machine" : "recorded from the call";
  return `# ${meetingName(job)}${label ? " — " + label : ""}\n\n` +
    `*${stamped(job.created_at)} · ${mmss(job.elapsed_s)} · ${where}*\n`;
}

/* An artifact carries its own "# Meeting Transcript" heading, which names the
   document rather than the meeting. Ours names the meeting, so theirs goes. */
const dropTopHeading = (body) => String(body || "").replace(/^\s*#\s+[^\n]*\n+/, "");

/* A notepad is a column of fragments, and Markdown folds consecutive lines
   into one paragraph - which would glue "priya -> migration fri" onto the end
   of the line above it. Two trailing spaces is the hard line break: invisible
   in the source and understood everywhere these notes might be pasted. */
const keepLineBreaks = (body) => String(body).split("\n")
  .map((line) => (line.trim() ? line.replace(/\s+$/, "") + "  " : ""))
  .join("\n").replace(/\s+$/, "");

/** Everything the page already holds for this meeting, as one document.

    The enhanced write-up is not wrapped in a heading of its own: it arrives
    with "## Summary" and "## Action items" already on it, so a "## Notes"
    above that is a heading with nothing under it. It *is* the document. What
    was typed during the call follows it, kept rather than thrown away, under
    the one heading that says which of the two you are looking at. */
function notesMarkdown(job) {
  const pad = state.pad || {};
  const enhanced = String(pad.enhanced || "").trim();
  const raw = String(pad.notes || "").trim();
  const parts = [exportHead(job)];
  if (enhanced) parts.push("\n" + enhanced + "\n");
  if (raw) {
    parts.push(`\n## ${enhanced ? "What I typed" : "Notes"}\n\n` +
      `${keepLineBreaks(raw)}\n`);
  }
  if (!enhanced && !raw) parts.push("\n*No notes were written for this meeting.*\n");
  return parts.join("");
}

/* "Summary" rather than "Call summary" on its own, where the H1 already
   names the meeting - but inside Everything the write-up usually has a
   "## Summary" section of its own, and two identical headings in one document
   is somebody's bad afternoon. */
const PIECE_NAME = { transcript: "Transcript", summary: "Summary" };
const PIECE_HEAD = { transcript: "Transcript", summary: "Call summary" };

/** The text behind one choice. Artifacts are fetched, notes are not. */
async function exportText(job, what) {
  if (what === "notes") return notesMarkdown(job);
  if (what === "all") {
    const parts = [notesMarkdown(job)];
    for (const piece of ["summary", "transcript"]) {
      if (!hasPiece(job, piece)) continue;
      const body = await api(`/api/meetings/${job.id}/artifact/${ARTIFACT_OF[piece]}`);
      parts.push(`\n## ${PIECE_HEAD[piece]}\n\n${dropTopHeading(body).trim()}\n`);
    }
    return parts.join("");
  }
  const body = await api(`/api/meetings/${job.id}/artifact/${ARTIFACT_OF[what]}`);
  return `${exportHead(job, PIECE_NAME[what])}\n${dropTopHeading(body).trim()}\n`;
}

/** Put text on the clipboard.

    `navigator.clipboard` needs a secure context. 127.0.0.1 is one, so the
    normal path works - but Scribe can be reached over the network, where it
    is not, and a dead Copy button is worse than a slightly odd one. Hence
    the old selection trick underneath. */
async function toClipboard(body) {
  try {
    await navigator.clipboard.writeText(body);
    return true;
  } catch (error) {
    const box = document.createElement("textarea");
    box.value = body;
    box.setAttribute("readonly", "");
    box.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(box);
    box.select();
    let copied = false;
    try { copied = document.execCommand("copy"); } catch (ignored) { copied = false; }
    box.remove();
    return copied;
  }
}

/** Hand the browser a file, built here out of text the page already has. */
function toFile(name, body) {
  const url = URL.createObjectURL(
    new Blob([body], { type: "text/markdown;charset=utf-8" })
  );
  const link = document.createElement("a");
  link.href = url;
  link.download = name;
  document.body.appendChild(link);
  link.click();
  link.remove();
  // Revoking straight away cancels the download in some builds.
  setTimeout(() => URL.revokeObjectURL(url), 10_000);
}

/** Say it worked on the button that was pressed - a toast in another corner
    of the screen is one more thing to go looking for. */
function flash(button, word) {
  if (button.dataset.was === undefined) button.dataset.was = button.innerHTML;
  button.innerHTML = word;
  button.classList.add("on");
  clearTimeout(button._flash);
  button._flash = setTimeout(() => {
    button.innerHTML = button.dataset.was;
    button.classList.remove("on");
  }, 1600);
}

const NO_CLIPBOARD =
  "This browser would not give up the clipboard. Download the file instead.";

/** The one-click path in the header: the write-up, on the clipboard. */
async function copyNotes(job, button) {
  try {
    const ok = await toClipboard(await exportText(job, "notes"));
    if (ok) flash(button, "Copied");
    else showError(NO_CLIPBOARD);
  } catch (error) {
    showError(error.message);
  }
}

const PIECES = [
  ["notes", "Notes", "The write-up, and anything you typed during the call"],
  ["transcript", "Transcript", "Every line, with who said it and when"],
  ["summary", "Summary", "The summary written when the recording stopped"],
  ["all", "Everything", "One file: notes, summary and transcript"],
];

/** Every way this meeting can leave Scribe. */
function openExport(job) {
  const root = $("modal-root");
  const close = () => { root.innerHTML = ""; };
  const offered = PIECES.filter(([what]) => hasPiece(job, what));

  root.innerHTML =
    '<div class="modal-bg"><div class="modal float">' +
      "<h3>Take this meeting with you</h3>" +
      '<p class="md-note" style="margin:6px 0 16px">' +
        `<strong>${esc(meetingName(job))}</strong> &mdash; as Markdown, which ` +
        "pastes into Slack, Notion, a doc or an email with its headings " +
        "intact. Nothing is uploaded; the file is built in this window.</p>" +
      offered.map(([what, name, blurb]) =>
        '<div class="exp-row">' +
          `<span class="exp-what"><b>${name}</b><span>${blurb}</span></span>` +
          `<button class="btn sm ghost" data-copy="${what}">Copy</button>` +
          `<button class="btn sm ghost" data-file="${what}">Download</button>` +
        "</div>").join("") +
      '<div class="err" id="exp-error" hidden></div>' +
      '<div class="row" style="margin-top:18px;justify-content:flex-end">' +
        '<button class="btn ghost sm" id="exp-done">Done</button>' +
      "</div>" +
    "</div></div>";

  $("exp-done").addEventListener("click", close);
  root.querySelector(".modal-bg").addEventListener("click", (event) => {
    if (event.target === event.currentTarget) close();
  });

  const fail = (message) => {
    const box = $("exp-error");
    box.textContent = message;
    box.hidden = false;
  };

  root.querySelectorAll("[data-copy]").forEach((button) => {
    button.addEventListener("click", async () => {
      try {
        const ok = await toClipboard(await exportText(job, button.dataset.copy));
        if (ok) flash(button, "Copied");
        else fail(NO_CLIPBOARD);
      } catch (error) { fail(error.message); }
    });
  });
  root.querySelectorAll("[data-file]").forEach((button) => {
    button.addEventListener("click", async () => {
      const what = button.dataset.file;
      try {
        toFile(exportName(job, what), await exportText(job, what));
        flash(button, "Saved");
      } catch (error) { fail(error.message); }
    });
  });
}

/** Ask before deleting a meeting, and say plainly what goes with it. */
function confirmDelete(job) {
  const root = $("modal-root");
  const close = () => { root.innerHTML = ""; };
  root.innerHTML =
    '<div class="modal-bg"><div class="modal float">' +
      "<h3>Delete this meeting?</h3>" +
      '<p class="md-note" style="margin:6px 0 0">' +
        `<strong>${esc(meetingName(job))}</strong> &mdash; the recording, its ` +
        "transcript, the notes and everything ever asked about it. " +
        "This cannot be undone.</p>" +
      '<div class="err" id="del-error" hidden></div>' +
      '<div class="row" style="margin-top:20px;justify-content:flex-end">' +
        '<button class="btn ghost sm" id="del-no">Keep it</button>' +
        '<button class="btn sm danger" id="del-yes">Delete</button>' +
      "</div>" +
    "</div></div>";

  $("del-no").addEventListener("click", close);
  root.querySelector(".modal-bg").addEventListener("click", (event) => {
    if (event.target === event.currentTarget) close();
  });
  $("del-yes").addEventListener("click", async () => {
    $("del-yes").disabled = true;
    try {
      await api(`/api/meetings/${job.id}`, { method: "DELETE" });
      close();
      state.selected = null;
      state.detail = null;
      state.pad = null;
      state.sig.list = "";
      state.sig.head = "";
      await poll();
      renderMain();
    } catch (error) {
      const box = $("del-error");
      box.textContent = error.message;
      box.hidden = false;
      $("del-yes").disabled = false;
    }
  });
}

async function stopMeeting(jobId) {
  state.stopping.add(jobId);
  state.sig.head = "";
  renderMain();
  try { await api(`/api/meetings/${jobId}/stop`, { method: "POST" }); }
  catch (error) { showError(error.message); state.stopping.delete(jobId); }
}

/* ----------------------------------------------------------------- poll */

async function poll() {
  try {
    const data = await api("/api/meetings");
    state.gone = 0;
    state.meetings = data.meetings || [];
    // Anything running or being written up turns the logo. Same test the
    // list rows use for "live", plus the write-up that outlives the call.
    $("app").classList.toggle("working", state.meetings.some(
      (job) => !["finished", "failed"].includes(job.status) || job.enhancing
    ));
    // The notification area asked for a meeting to be shown. It is handed
    // over once, so acting on it here cannot fight a click somewhere else.
    if (data.focus && data.focus !== state.selected) {
      await select(data.focus);
      return;
    }
    for (const job of state.meetings) {
      if (["finished", "failed"].includes(job.status)) state.stopping.delete(job.id);
    }
    const total = state.meetings.length;
    $("chat-scope").textContent = total
      ? `${total} meeting${total === 1 ? "" : "s"}` : "No meetings yet";
    pollCalls();
    // The open meeting can vanish from the list - most often because the
    // server restarted, and a recording that was live comes back under its
    // past-run id. Asking for the old id every two seconds forever helps
    // nobody, so move to one that exists.
    if (state.selected && !state.meetings.some((j) => j.id === state.selected)) {
      state.selected = null;
      state.detail = null;
      state.sig.head = "";
    }
    if (!state.selected && state.meetings.length) {
      await select(state.meetings[0].id);
      return;
    }
    renderSidebar();
    if (state.selected) { await refreshSelected(); renderMain(); }
    // Readiness changes rarely, so it is re-read every tenth poll rather than
    // every one - enough to notice a re-check done elsewhere and to keep the
    // "checked N minutes ago" honest, without 30 requests a minute for it.
    if (state.pollCount++ % 10 === 0) {
      try { state.health = await api("/api/health"); renderHealth(); }
      catch (_) { /* non-fatal */ }
    }
  } catch (error) {
    if (String(error.message).includes("signed out")) return;
    console.warn(error);
    // Quitting Scribe closes the window it opened itself. A tab you opened
    // cannot be closed by script that did not open it - so this one says what
    // happened instead of sitting there looking live.
    if (++state.gone >= 2) showStopped();
  }
}

/** The page after Scribe has gone. Nothing here polls or saves. */
function showStopped() {
  if (state.stopped) return;
  state.stopped = true;
  if (state.pollTimer) clearInterval(state.pollTimer);
  // Works when Scribe opened this window itself; ignored otherwise, which is
  // why there is a message underneath it.
  window.close();
  const root = $("modal-root");
  root.innerHTML =
    '<div class="modal-bg"><div class="modal float" style="text-align:center">' +
      "<h3>Scribe has stopped</h3>" +
      '<p class="md-note">This page is no longer live. Start Scribe again from ' +
      "the Desktop icon, then reload.</p>" +
      '<div class="row" style="margin-top:16px;justify-content:center">' +
        '<button class="btn primary sm" id="stopped-reload">Reload</button>' +
      "</div>" +
    "</div></div>";
  $("stopped-reload").addEventListener("click", () => location.reload());
}

/* ---------------------------------------------------------------- admin */

async function openAdmin() {
  const root = $("modal-root");
  const close = () => { root.innerHTML = ""; };
  const draw = (users) => {
    root.innerHTML =
      '<div class="modal-bg"><div class="modal float">' +
        "<h3>Accounts</h3>" +
        '<p class="md-note" style="margin:0 0 12px">Admins see every meeting. ' +
        "Members see only the ones they started.</p>" +
        users.map((u) =>
          '<div class="user-row">' +
            `<strong class="grow">${esc(u.username)}</strong>` +
            `<span class="pill">${esc(u.role)}</span>` +
            (u.username === state.me.username ? "" :
              `<button class="btn sm danger" data-del="${esc(u.username)}">Remove</button>`) +
          "</div>").join("") +
        '<div class="newuser">' +
          '<input id="nu-name" type="text" placeholder="username" autocapitalize="none" spellcheck="false">' +
          '<input id="nu-pass" type="password" placeholder="password (min 8)">' +
          '<select id="nu-role"><option value="member">Member</option>' +
          '<option value="admin">Admin</option></select>' +
          '<button class="btn sm" id="nu-add">Add</button>' +
        "</div>" +
        '<div class="err" id="admin-error" hidden></div>' +
        '<div class="row" style="margin-top:16px;justify-content:flex-end">' +
          '<button class="btn ghost sm" id="admin-close">Close</button>' +
        "</div>" +
      "</div></div>";

    $("admin-close").addEventListener("click", close);
    root.querySelector(".modal-bg").addEventListener("click", (event) => {
      if (event.target === event.currentTarget) close();
    });
    root.querySelectorAll("[data-del]").forEach((el) => {
      el.addEventListener("click", () => act(
        () => api(`/api/users/${encodeURIComponent(el.dataset.del)}`, { method: "DELETE" })));
    });
    $("nu-add").addEventListener("click", () => act(() => api("/api/users", {
      method: "POST",
      body: JSON.stringify({
        username: $("nu-name").value.trim(),
        password: $("nu-pass").value,
        role: $("nu-role").value,
      }),
    })));
  };

  const act = async (fn) => {
    try { await fn(); draw((await api("/api/users")).users); }
    catch (error) {
      const box = $("admin-error");
      if (box) { box.textContent = error.message; box.hidden = false; }
    }
  };

  try { draw((await api("/api/users")).users); }
  catch (error) { showError(error.message); }
}

/* ------------------------------------------------------------------ init */

async function init() {
  // A notification's link carries the call it is about. Read it once and
  // take it out of the address bar, so a reload does not act on it again.
  const params = new URLSearchParams(window.location.search);
  if (params.get("record")) state.callLink = { record: params.get("record") };
  else if (params.get("call")) state.callLink = { call: params.get("call") };
  // The icon's "Latest notes" names the meeting to open. Same reasoning: once.
  const wanted = params.get("meeting") || "";
  if (state.callLink || wanted) history.replaceState(null, "", window.location.pathname);

  try {
    const [me, config, templates] = await Promise.all([
      api("/api/me"), api("/api/config"), api("/api/templates"),
    ]);
    state.me = me;
    state.config = config;
    state.templates = templates.templates || [];
    state.defaultTemplate = templates.default || "general";
    $("me").textContent = me.username;
    $("admin-open").hidden = me.role !== "admin";
    $("opt-names").checked = !!config.speaker_names_from_captions;
    $("opt-overlay").checked = !!config.live_captions_overlay;
    $("opt-anon").checked = !!config.anonymise_analysis;
  } catch (error) {
    if (String(error.message).includes("signed out")) return;
    showError(error.message);
  }

  try { state.health = await api("/api/health"); renderHealth(); } catch (_) { /* non-fatal */ }

  $("send").addEventListener("click", sendBot);
  $("url").addEventListener("keydown", (e) => { if (e.key === "Enter") sendBot(); });
  $("record").addEventListener("click", startRecording);
  $("rec-title").addEventListener("keydown", (e) => {
    if (e.key === "Enter") startRecording();
  });
  document.querySelectorAll("#modes button").forEach((el) => {
    el.addEventListener("click", () => {
      document.querySelectorAll("#modes button").forEach((b) =>
        b.classList.toggle("on", b === el));
      const local = el.dataset.mode === "local";
      $("form-local").hidden = !local;
      $("form-bot").hidden = local;
      showError("");
    });
  });
  checkAudio();
  $("admin-open").addEventListener("click", openAdmin);

  // The chat rail: open by default where there is room for it.
  state.citations = prefs.get("scribe.citations", true) !== false;
  document.querySelectorAll(".cite-switch").forEach((el) => { el.checked = state.citations; });
  document.addEventListener("change", (event) => {
    if (event.target.classList && event.target.classList.contains("cite-switch")) {
      setCitations(event.target.checked);
    }
  });
  $("chat-toggle").addEventListener("click", () => setChatOpen(!state.chatOpen, { focus: true }));
  $("chat-close").addEventListener("click", () => setChatOpen(false));
  $("chat-clear").addEventListener("click", clearEverythingChat);
  $("chat-go").addEventListener("click", () => askEverything());
  const chatInput = $("chat-input");
  chatInput.addEventListener("input", () => autoGrow(chatInput));
  chatInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      askEverything();
    }
  });
  setChatOpen(prefs.get("scribe.chatOpen", window.innerWidth >= 1200) === true);
  renderChat(false);

  // A source card closes on Escape, on a click elsewhere, and when what it
  // points at scrolls away underneath it.
  document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeCiteCard(); });
  document.addEventListener("mousedown", (event) => {
    const card = document.querySelector(".citecard");
    if (card && !card.contains(event.target) && !event.target.closest("[data-n]")) closeCiteCard();
  });
  document.addEventListener("scroll", (event) => {
    const card = document.querySelector(".citecard");
    if (card && !card.contains(event.target)) closeCiteCard();
  }, true);
  window.addEventListener("resize", closeCiteCard);

  // A refresh mid-sentence should not lose the last thing typed.
  window.addEventListener("beforeunload", () => {
    if (state.saveState !== "editing" || !state.selected) return;
    const box = $("notepad");
    if (!box) return;
    fetch(`/api/meetings/${state.selected}/notes`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ notes: box.value }),
      keepalive: true,
    });
  });

  await poll();
  // Before the first render, so arriving from the icon does not flash the
  // meeting that happens to be newest and then move.
  if (wanted) await select(wanted);
  renderMain();
  const findBox = $("mtg-find");
  if (findBox) {
    findBox.addEventListener("input", () => {
      state.filter = findBox.value;
      renderSidebar();
    });
  }

  state.pollTimer = setInterval(poll, 2000);
  setInterval(advanceThinking, 2600);
}

init();
</script>
