<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scribe</title>
<style>
  /* Warm paper rather than the usual cold grey: notes are a document, and a
     document should not look like a terminal. One green accent, used only
     for things that are live or actionable. */
  :root {
    --bg: #f4f2ef;      --panel: #ffffff;   --raised: #fbfaf8;
    --ink: #191817;     --muted: #6d6862;   --faint: #97918a;
    --line: #e5e0d9;    --line-soft: #efebe5;
    --accent: #2f6f4f;  --accent-ink: #ffffff; --accent-wash: #e8f0ea;
    --ok: #2f6f4f;      --bad: #b3402e;     --warn: #8a6420;
    --shadow: 0 1px 2px rgba(25, 24, 23, .05), 0 4px 16px rgba(25, 24, 23, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121211;    --panel: #1a1918;   --raised: #201f1d;
      --ink: #eae7e2;   --muted: #968f87;   --faint: #6f6862;
      --line: #2d2b28;  --line-soft: #232220;
      --accent: #79bd97; --accent-ink: #10201a; --accent-wash: #1c2a22;
      --ok: #79bd97;    --bad: #e0705a;     --warn: #cfa257;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .2);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  ::selection { background: var(--accent-wash); }

  /* -- shell ------------------------------------------------------------ */
  .app { display: flex; flex-direction: column; height: 100vh; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; height: 52px; flex: 0 0 auto;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 650;
           letter-spacing: -0.015em; font-size: 15.5px; }
  .brand .dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
  }
  .brand small {
    font-weight: 450; color: var(--faint); font-size: 12.5px;
    letter-spacing: 0; margin-left: 2px;
  }
  .topbar-right { display: flex; align-items: center; gap: 10px;
                  font-size: 13px; color: var(--muted); }
  .body { display: flex; flex: 1 1 auto; min-height: 0; }

  /* -- sidebar ---------------------------------------------------------- */
  .side {
    width: 292px; flex: 0 0 292px; border-right: 1px solid var(--line);
    background: var(--panel); display: flex; flex-direction: column;
    min-height: 0;
  }
  .side-top { padding: 16px 16px 14px; border-bottom: 1px solid var(--line-soft); }
  .side-list { overflow-y: auto; flex: 1 1 auto; padding: 8px 10px 24px; }
  .daygroup {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .07em; color: var(--faint);
    padding: 14px 8px 6px;
  }
  .mtg {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: transparent; border: 1px solid transparent; border-radius: 9px;
    padding: 9px 11px; margin-bottom: 2px;
  }
  .mtg:hover { background: var(--raised); }
  .mtg.on { background: var(--accent-wash); border-color: transparent; }
  .mtg-top { display: flex; align-items: center; gap: 7px; }
  .mtg-name {
    font-weight: 600; font-size: 13.5px; letter-spacing: -0.005em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto;
  }
  .mtg-sub {
    font-size: 12px; color: var(--muted); margin-top: 2px;
    display: flex; gap: 7px; align-items: center;
  }
  .pill {
    font-size: 10px; font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase; padding: 2px 6px; border-radius: 5px;
    background: var(--line-soft); color: var(--muted); flex: 0 0 auto;
  }
  .pill.live { background: var(--accent); color: var(--accent-ink); }
  .pill.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
  .pill.warm { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .tick { color: var(--accent); font-size: 11px; }

  /* -- forms ------------------------------------------------------------ */
  label.field { display: block; font-size: 12px; font-weight: 650;
                color: var(--muted); margin-bottom: 6px; letter-spacing: .01em; }
  input[type=text], input[type=password], textarea, select {
    width: 100%; padding: 9px 11px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; font-size: 14px;
  }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-wash);
  }
  button.btn {
    font-weight: 600; font-size: 13.5px; padding: 9px 15px; border-radius: 8px;
    border: 1px solid transparent; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
  }
  button.btn:disabled { opacity: .5; cursor: not-allowed; }
  button.btn.ghost { background: var(--panel); color: var(--ink); border-color: var(--line); }
  button.btn.ghost:hover:not(:disabled) { background: var(--raised); }
  button.btn.quiet { background: transparent; color: var(--muted); border-color: transparent; }
  button.btn.quiet:hover:not(:disabled) { background: var(--raised); color: var(--ink); }
  button.btn.danger { background: transparent; color: var(--bad); border-color: var(--line); }
  button.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 7px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .grow { flex: 1 1 auto; }
  details.opts { margin-top: 10px; }
  details.opts summary {
    cursor: pointer; font-size: 12.5px; color: var(--muted);
    list-style: none; user-select: none;
  }
  details.opts summary::-webkit-details-marker { display: none; }
  details.opts summary::before { content: "▸ "; font-size: 10px; }
  details.opts[open] summary::before { content: "▾ "; }
  .opt {
    display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px;
    color: var(--muted); margin-top: 9px; line-height: 1.45;
  }
  .opt input { margin-top: 2px; flex: 0 0 auto; }

  /* -- main ------------------------------------------------------------- */
  .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .mhead {
    padding: 18px 28px 0; flex: 0 0 auto;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .mtitle { display: flex; align-items: center; gap: 11px; }
  .mtitle h2 {
    margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -0.02em;
  }
  .mmeta {
    color: var(--muted); font-size: 12.5px; margin-top: 4px;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .mmeta .sep { color: var(--line); }
  .tabs { display: flex; gap: 2px; margin-top: 14px; }
  .tab {
    background: transparent; border: 0; border-bottom: 2px solid transparent;
    padding: 8px 12px 9px; cursor: pointer; font-size: 13.5px; font-weight: 550;
    color: var(--muted); border-radius: 7px 7px 0 0;
  }
  .tab:hover { color: var(--ink); background: var(--raised); }
  .tab.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 650; }
  .tab .count {
    font-size: 11px; color: var(--faint); margin-left: 5px; font-weight: 500;
  }
  .pane { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 20px 28px 40px; }

  /* -- notes ------------------------------------------------------------ */
  .notebar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .notebar select { width: auto; min-width: 148px; padding: 7px 10px; font-size: 13px; }
  .savestate { font-size: 12px; color: var(--faint); min-width: 92px; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 20px; }
  @media (max-width: 1080px) { .split { grid-template-columns: minmax(0, 1fr); } }
  .col-head {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .07em; color: var(--faint); margin-bottom: 8px;
    display: flex; align-items: baseline; gap: 7px;
  }
  /* The template name sits next to the column label, not pushed to the far
     edge of a wide column where it reads as unrelated. */
  #tpl-used { text-transform: none; letter-spacing: 0; font-weight: 500; }
  #notepad {
    width: 100%; min-height: 400px; resize: vertical; padding: 16px 18px;
    background: var(--panel); border-radius: 10px; border: 1px solid var(--line);
    font-size: 14.5px; line-height: 1.7; box-shadow: var(--shadow);
  }
  #notepad::placeholder { color: var(--faint); }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 6px 20px 18px; box-shadow: var(--shadow); min-height: 400px;
  }
  .placeholder {
    color: var(--faint); font-size: 13.5px; padding: 36px 4px; text-align: center;
    line-height: 1.7;
  }
  .placeholder strong { color: var(--muted); font-weight: 600; }

  /* -- rendered markdown ------------------------------------------------ */
  .doc { font-size: 14.5px; line-height: 1.68; }
  .doc .md-h1, .doc .md-h2 {
    font-size: 15.5px; font-weight: 680; letter-spacing: -0.01em;
    margin: 22px 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--line-soft);
  }
  .doc .md-h3, .doc .md-h4 {
    font-size: 14px; font-weight: 680; margin: 18px 0 6px; color: var(--ink);
  }
  .doc .md-h1:first-child, .doc .md-h2:first-child { margin-top: 12px; }
  .doc .md-p { margin: 8px 0; }
  .doc .md-list { margin: 8px 0; padding-left: 20px; }
  .doc .md-list li { margin: 5px 0; }
  .doc .md-task {
    list-style: none; margin-left: -20px; display: flex; gap: 9px;
    align-items: flex-start;
  }
  .doc .md-task .box {
    flex: 0 0 15px; height: 15px; margin-top: 4px; border-radius: 4px;
    border: 1.5px solid var(--faint); font-size: 11px; line-height: 13px;
    text-align: center; color: var(--accent);
  }
  .doc .md-task.done .box { border-color: var(--accent); background: var(--accent-wash); }
  .doc .md-turn { margin: 18px 0 1px; display: flex; gap: 9px; align-items: baseline; }
  .doc .md-time {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11.5px; color: var(--faint);
  }
  .doc .md-who { font-weight: 680; font-size: 13.5px; }
  .doc .md-rule { border: 0; border-top: 1px solid var(--line-soft); margin: 22px 0 14px; }
  .doc .md-note { color: var(--faint); font-size: 12.5px; }
  .doc code {
    background: var(--raised); border: 1px solid var(--line-soft);
    padding: 1px 5px; border-radius: 5px; font-size: 12.5px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .doc strong { font-weight: 680; }

  /* -- live transcript --------------------------------------------------- */
  .live-line { margin: 10px 0; display: flex; gap: 10px; align-items: baseline; }
  .live-line .t {
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px;
    color: var(--faint); flex: 0 0 auto;
  }
  .live-line .w { font-weight: 650; flex: 0 0 auto; }

  /* -- ask --------------------------------------------------------------- */
  .askwrap { max-width: 760px; }
  .turn { margin-bottom: 20px; }
  .turn .q {
    font-weight: 650; font-size: 14.5px; margin-bottom: 7px;
    display: flex; gap: 9px; align-items: flex-start;
  }
  .turn .q::before { content: "?"; color: var(--accent); font-weight: 800; }
  .turn .a {
    border-left: 2px solid var(--line); padding-left: 15px; margin-left: 4px;
    color: var(--ink);
  }
  .askbar { display: flex; gap: 9px; margin: 4px 0 22px; }
  .suggest { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 18px; }
  .suggest button {
    background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
    padding: 6px 13px; font-size: 12.5px; color: var(--muted); cursor: pointer;
  }
  .suggest button:hover { border-color: var(--accent); color: var(--ink); }

  /* -- misc -------------------------------------------------------------- */
  .banner {
    padding: 11px 28px; font-size: 13px; border-bottom: 1px solid var(--line);
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .banner.bad { background: color-mix(in srgb, var(--bad) 9%, var(--panel)); color: var(--bad); }
  .banner.warn { background: color-mix(in srgb, var(--warn) 11%, var(--panel)); color: var(--warn); }
  .err {
    color: var(--bad); font-size: 13px; margin-top: 10px;
    border-left: 2px solid var(--bad); padding-left: 11px; line-height: 1.5;
  }
  .empty-main {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; text-align: center; color: var(--muted);
    padding: 40px;
  }
  .empty-main h3 { margin: 0 0 8px; font-size: 17px; font-weight: 650; color: var(--ink); }
  .empty-main p { margin: 0; max-width: 380px; font-size: 13.5px; line-height: 1.65; }
  .spin {
    display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent);
    animation: spin .7s linear infinite; vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }

  /* -- modal ------------------------------------------------------------- */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(25, 24, 23, .38);
    display: flex; align-items: center; justify-content: center; padding: 24px;
    z-index: 20;
  }
  .modal {
    background: var(--panel); border-radius: 13px; border: 1px solid var(--line);
    width: 100%; max-width: 560px; max-height: 82vh; overflow-y: auto;
    padding: 22px 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, .22);
  }
  .modal h3 { margin: 0 0 4px; font-size: 16px; font-weight: 680; }
  .user-row {
    display: flex; align-items: center; gap: 9px; padding: 10px 0;
    border-bottom: 1px solid var(--line-soft); font-size: 13.5px;
  }
  .newuser { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 14px; }
  .newuser input, .newuser select { width: auto; flex: 1 1 120px; padding: 7px 10px; font-size: 13px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="dot"></span> Scribe <small>meeting notes</small>
    </div>
    <div class="topbar-right">
      <span id="me"></span>
      <button class="btn sm quiet" id="admin-open" hidden>Accounts</button>
      <form method="post" action="/logout" style="display:inline">
        <button class="btn sm ghost" type="submit">Sign out</button>
      </form>
    </div>
  </div>

  <div id="health"></div>

  <div class="body">
    <div class="side">
      <div class="side-top">
        <label class="field" for="url">New meeting</label>
        <input type="text" id="url" placeholder="meet.google.com/abc-defg-hij"
               autocomplete="off" spellcheck="false">
        <div class="row" style="margin-top:9px">
          <button class="btn grow" id="send">Send bot</button>
        </div>
        <details class="opts">
          <summary>Options</summary>
          <label class="opt">
            <input type="checkbox" id="opt-names">
            <span>Try to read real speaker names from the captions panel</span>
          </label>
          <label class="opt">
            <input type="checkbox" id="opt-overlay">
            <span>Show live captions <strong>to everyone</strong> in the call
                  &mdash; this is a screen-share, not a private overlay</span>
          </label>
          <label class="opt">
            <input type="checkbox" id="opt-anon">
            <span>Replace speaker names with pseudonyms before any AI call</span>
          </label>
        </details>
        <div class="err" id="error" hidden></div>
      </div>
      <div class="side-list" id="meetings"></div>
    </div>

    <div class="main" id="main"></div>
  </div>
</div>

<div id="modal-root"></div>

<script>
"use strict";

/* ------------------------------------------------------------------ state */

const $ = (id) => document.getElementById(id);

const state = {
  me: null,
  config: null,
  templates: [],
  defaultTemplate: "general",
  health: null,
  meetings: [],
  selected: null,          // job id
  detail: null,            // full job payload for `selected`
  pad: null,               // { notes, enhanced, template, chat, ready }
  tab: "notes",
  /* The notepad is a controlled-once textarea: its value is loaded when you
     switch meetings and is client-owned from then on. Re-filling it from a
     2-second poll would delete whatever you were mid-way through typing. */
  padLoadedFor: null,
  saveTimer: null,
  saveState: "",           // "" | "editing" | "saving" | "saved" | "error"
  enhancing: false,
  asking: false,
  sending: false,
  stopping: new Set(),
  /* Signatures of what is currently painted, so the poll loop only rebuilds
     a region when it actually changed. Rebuilding on a timer throws away
     scroll position and text selection. */
  sig: { list: "", head: "", transcript: "", enhanced: "", chat: "" },
};

const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const mmss = (s) => {
  s = Math.max(0, Math.round(s || 0));
  const h = Math.floor(s / 3600);
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
  const sec = String(s % 60).padStart(2, "0");
  return h ? `${h}:${m}:${sec}` : `${m}:${sec}`;
};

const clock = (epoch) => epoch
  ? new Date(epoch * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
  : "";

/** Day bucket for the sidebar: Today, Yesterday, or a date. */
function dayGroup(epoch) {
  if (!epoch) return "Earlier";
  const d = new Date(epoch * 1000);
  const today = new Date();
  const yesterday = new Date(today.getTime() - 86400000);
  if (d.toDateString() === today.toDateString()) return "Today";
  if (d.toDateString() === yesterday.toDateString()) return "Yesterday";
  return d.toLocaleDateString([], { day: "numeric", month: "short", year:
    d.getFullYear() === today.getFullYear() ? undefined : "numeric" });
}

/** The meeting code, which is the only name we have - there is no calendar. */
function meetingName(job) {
  const url = job.meet_url || "";
  const match = url.match(/([a-z]{3}-[a-z]{4}-[a-z]{3})/i);
  if (match) return match[1];
  return url.replace(/^https?:\/\//, "").replace(/^meet\.google\.com\//, "") || "Meeting";
}

const STATUS_PILL = {
  in_call: ["live", "Recording"],
  joining: ["warm", "Joining"],
  starting: ["warm", "Starting"],
  stopping: ["warm", "Wrapping up"],
  finished: ["", "Done"],
  failed: ["bad", "Failed"],
};

/* ------------------------------------------------------------- markdown */

/* Just enough Markdown for what Scribe actually writes: headings, bullets,
   task items, bold, and the "[00:01:33] Speaker" blocks in a transcript. A
   real parser would be a dependency; this covers our own output and makes it
   read as a document rather than a monospace wall. */
function renderMarkdown(text) {
  const out = [];
  let inList = false;
  let pastRule = false;
  const closeList = () => { if (inList) { out.push("</ul>"); inList = false; } };

  // Bold before italic, so the ** in **bold** is not eaten as two *italics*.
  // The lookarounds keep snake_case identifiers and mid-word asterisks
  // intact - without them "openai/gpt-oss-120b" and file_names_like_this
  // get mangled.
  const inline = (s) => esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^\w*])\*(?!\s)(.+?)(?<!\s)\*(?![\w*])/g, "$1<em>$2</em>")
    .replace(/(^|[^\w_])_(?!\s)(.+?)(?<!\s)_(?![\w_])/g, "$1<em>$2</em>")
    .replace(/`(.+?)`/g, "<code>$1</code>");

  for (const raw of String(text).split("\n")) {
    const line = raw.trimEnd();
    if (!line.trim()) { closeList(); continue; }
    if (/^(-{3,}|\*{3,})$/.test(line.trim())) {
      closeList(); pastRule = true; out.push('<hr class="md-rule">'); continue;
    }

    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
      closeList();
      const level = Math.min(m[1].length, 4);
      out.push(`<div class="md-h${level}">${inline(m[2])}</div>`);
    } else if ((m = line.match(/^\s*[-*]\s+\[( |x)\]\s+(.*)$/i))) {
      if (!inList) { out.push('<ul class="md-list">'); inList = true; }
      const done = m[1].toLowerCase() === "x";
      out.push(
        `<li class="md-task${done ? " done" : ""}">` +
        `<span class="box">${done ? "&#10003;" : ""}</span>` +
        `<span>${inline(m[2])}</span></li>`
      );
    } else if ((m = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)$/))) {
      if (!inList) { out.push('<ul class="md-list">'); inList = true; }
      out.push(`<li>${inline(m[1])}</li>`);
    } else if ((m = line.match(/^\*\*\[([\d:]+)\]\s+(.*?)\*\*$/))) {
      // Transcript speaker block: "**[00:01:33] Neil Sharma**"
      closeList();
      out.push(
        `<div class="md-turn"><span class="md-time">${esc(m[1])}</span>` +
        `<span class="md-who">${esc(m[2])}</span></div>`
      );
    } else {
      closeList();
      // Everything below the closing rule is provenance footer, not prose.
      out.push(`<p class="md-p${pastRule ? " md-note" : ""}">${inline(line.trim())}</p>`);
    }
  }
  closeList();
  return out.join("");
}

/* ------------------------------------------------------------------- api */

async function api(path, options) {
  const response = await fetch(path, {
    headers: { "Content-Type": "application/json" }, ...options,
  });
  if (response.status === 401) { window.location.href = "/login"; throw new Error("signed out"); }
  const isJson = (response.headers.get("content-type") || "").includes("json");
  const payload = isJson ? await response.json() : await response.text();
  if (!response.ok) {
    const detail = isJson ? (payload.detail || JSON.stringify(payload)) : payload;
    throw new Error(detail || `Request failed (${response.status})`);
  }
  return payload;
}

const showError = (message) => {
  const box = $("error");
  box.textContent = message;
  box.hidden = !message;
};

/* -------------------------------------------------------------- sidebar */

function renderSidebar() {
  const signature = JSON.stringify(state.meetings.map((j) => [
    j.id, j.status, j.utterance_count, j.has_enhanced, j.has_notes,
    j.id === state.selected,
  ]));
  if (signature === state.sig.list) return;
  state.sig.list = signature;

  const host = $("meetings");
  if (!state.meetings.length) {
    host.innerHTML =
      '<div class="placeholder">No meetings yet.<br>Paste a Meet link above ' +
      'to send the bot.</div>';
    return;
  }

  const parts = [];
  let group = null;
  for (const job of state.meetings) {
    const bucket = dayGroup(job.created_at);
    if (bucket !== group) { group = bucket; parts.push(`<div class="daygroup">${esc(bucket)}</div>`); }
    const [tone, label] = STATUS_PILL[job.status] || ["", job.status];
    const live = !["finished", "failed"].includes(job.status);
    parts.push(
      `<button class="mtg${job.id === state.selected ? " on" : ""}" data-id="${esc(job.id)}">` +
        `<div class="mtg-top">` +
          `<span class="mtg-name">${esc(meetingName(job))}</span>` +
          (live || job.status === "failed"
            ? `<span class="pill ${tone}">${esc(label)}</span>` : "") +
        `</div>` +
        `<div class="mtg-sub">` +
          `<span>${esc(clock(job.created_at))}</span>` +
          `<span>${esc(mmss(job.elapsed_s))}</span>` +
          (job.has_enhanced ? '<span class="tick" title="Notes enhanced">&#9679;</span>' : "") +
        `</div>` +
      `</button>`
    );
  }
  host.innerHTML = parts.join("");
  host.querySelectorAll(".mtg").forEach((el) => {
    el.addEventListener("click", () => select(el.dataset.id));
  });
}

/* ----------------------------------------------------------------- main */

function renderMain() {
  const host = $("main");
  if (!state.selected || !state.detail) {
    if (state.sig.head === "empty") return;
    state.sig.head = "empty";
    host.innerHTML =
      '<div class="empty-main">' +
        "<h3>Take notes, not minutes</h3>" +
        "<p>Send the bot to a call, then jot down whatever you can. " +
        "Scribe fills the rest in from the transcript afterwards.</p>" +
      "</div>";
    return;
  }

  const job = state.detail;
  const counts = { transcript: job.utterance_count || 0 };
  /* Only *structural* changes rebuild the header and pane. The elapsed clock
     and the utterance count tick on every poll, and rebuilding on those
     would recreate the notepad textarea every two seconds - deleting
     whatever was being typed into it. They are written in place below. */
  const signature = JSON.stringify([
    job.id, job.status, state.tab, job.has_summary, state.stopping.has(job.id),
  ]);
  const rebuild = signature !== state.sig.head;
  if (rebuild) {
    state.sig.head = signature;
    // A rebuild throws the textarea away, so rescue anything unsaved first.
    const openBox = $("notepad");
    if (openBox && state.pad && state.saveState === "editing") {
      state.pad.notes = openBox.value;
    }
    const [tone, label] = STATUS_PILL[job.status] || ["", job.status];
    const live = !["finished", "failed"].includes(job.status);
    const tab = (id, text, counted) =>
      `<button class="tab${state.tab === id ? " on" : ""}" data-tab="${id}">${text}` +
      (counted ? '<span class="count" id="t-count"></span>' : "") + "</button>";

    host.innerHTML =
      '<div class="mhead">' +
        '<div class="mtitle">' +
          `<h2>${esc(meetingName(job))}</h2>` +
          `<span class="pill ${tone}">${esc(label)}</span>` +
          '<span class="grow"></span>' +
          (live
            ? `<button class="btn sm danger" id="stop"${state.stopping.has(job.id) ? " disabled" : ""}>` +
              `${state.stopping.has(job.id) ? "Stopping&hellip;" : "Stop &amp; write notes"}</button>`
            : "") +
        "</div>" +
        '<div class="mmeta">' +
          `<span>${esc(clock(job.created_at))}</span><span class="sep">&middot;</span>` +
          '<span id="m-elapsed"></span><span class="sep">&middot;</span>' +
          '<span id="m-count"></span>' +
          (job.meet_url ? `<span class="sep">&middot;</span><a href="${esc(job.meet_url)}" ` +
            'target="_blank" rel="noopener" style="color:var(--muted)">open call</a>' : "") +
        "</div>" +
        '<div class="tabs">' +
          tab("notes", "Notes") +
          tab("transcript", "Transcript", true) +
          tab("ask", "Ask") +
          (job.has_summary ? tab("summary", "Summary") : "") +
        "</div>" +
      "</div>" +
      '<div class="pane" id="pane"></div>';

    host.querySelectorAll(".tab").forEach((el) => {
      el.addEventListener("click", () => {
        flushNotes();
        state.tab = el.dataset.tab;
        state.sig.head = "";      // repaint the tab strip
        state.sig.enhanced = state.sig.transcript = state.sig.chat = "";
        renderMain();
      });
    });
    const stop = $("stop");
    if (stop) stop.addEventListener("click", () => stopMeeting(job.id));

    // The pane is new, so whatever was painted into it is gone.
    state.sig.enhanced = state.sig.transcript = state.sig.chat = "";
  }

  // Volatile figures, written in place on every poll - see the note above.
  const elapsed = $("m-elapsed");
  if (elapsed) elapsed.textContent = mmss(job.elapsed_s);
  const count = $("m-count");
  if (count) {
    count.textContent =
      `${counts.transcript} utterance${counts.transcript === 1 ? "" : "s"}`;
  }
  const tabCount = $("t-count");
  if (tabCount) tabCount.textContent = counts.transcript ? String(counts.transcript) : "";

  if (state.tab === "notes") renderNotes(rebuild);
  else if (state.tab === "transcript") renderTranscript(rebuild);
  else if (state.tab === "ask") renderAsk(rebuild);
  else if (state.tab === "summary") renderSummary(rebuild);
}

/* ---------------------------------------------------------------- notes */

function renderNotes(rebuild) {
  const pane = $("pane");
  if (!pane) return;
  const pad = state.pad || { notes: "", enhanced: "", template: state.defaultTemplate, chat: [] };

  if (rebuild || !$("notepad")) {
    const options = state.templates.map((t) =>
      `<option value="${esc(t.id)}" title="${esc(t.blurb)}">${esc(t.name)}</option>`
    ).join("");
    pane.innerHTML =
      '<div class="notebar">' +
        `<select id="template" title="How the enhanced notes are shaped">${options}</select>` +
        '<button class="btn" id="enhance">Enhance notes</button>' +
        '<span class="savestate" id="savestate"></span>' +
      "</div>" +
      '<div class="err" id="note-error" hidden></div>' +
      '<div class="split">' +
        "<div>" +
          '<div class="col-head"><span>Your notes</span></div>' +
          '<textarea id="notepad" spellcheck="true" placeholder="Type as the meeting ' +
          'runs — fragments are fine.\n\nbudget approved?\npriya → migration\nreview fri"></textarea>' +
        "</div>" +
        "<div>" +
          '<div class="col-head"><span>Enhanced</span><span id="tpl-used"></span></div>' +
          '<div class="card"><div class="doc" id="enhanced"></div></div>' +
        "</div>" +
      "</div>";

    const box = $("notepad");
    box.value = pad.notes || "";
    state.padLoadedFor = state.selected;
    box.addEventListener("input", onNoteInput);
    // Ctrl/Cmd+Enter is the "I'm done, write it up" gesture.
    box.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
        event.preventDefault();
        runEnhance();
      }
    });
    $("template").value = pad.template || state.defaultTemplate;
    $("template").addEventListener("change", () => { state.sig.enhanced = ""; renderNotes(false); });
    $("enhance").addEventListener("click", runEnhance);
  }

  // Load the notes exactly once per meeting; after that the textarea is the
  // source of truth and the poll loop must not touch it.
  if (state.padLoadedFor !== state.selected) {
    $("notepad").value = pad.notes || "";
    $("template").value = pad.template || state.defaultTemplate;
    state.padLoadedFor = state.selected;
  }

  const busy = state.enhancing;
  const button = $("enhance");
  button.disabled = busy;
  button.innerHTML = busy
    ? '<span class="spin"></span> Enhancing&hellip;'
    : (pad.enhanced ? "Re-enhance" : "Enhance notes");

  const SAVE_TEXT = { editing: "Unsaved", saving: "Saving…", saved: "Saved", error: "Not saved" };
  $("savestate").textContent = SAVE_TEXT[state.saveState] || "";

  const signature = `${pad.enhanced.length}:${busy}:${pad.template}`;
  if (signature !== state.sig.enhanced) {
    state.sig.enhanced = signature;
    const host = $("enhanced");
    const scroll = host.parentElement.scrollTop;
    if (pad.enhanced) {
      host.innerHTML = renderMarkdown(pad.enhanced);
      const used = state.templates.find((t) => t.id === pad.template);
      $("tpl-used").textContent = used ? `· ${used.name}` : "";
    } else {
      $("tpl-used").textContent = "";
      host.innerHTML =
        '<div class="placeholder">Nothing here yet.<br><br>Write whatever you can in ' +
        "the notepad, then press <strong>Enhance notes</strong> and Scribe will fill " +
        "them in from the transcript.<br><br>Left it blank? Enhance anyway &mdash; " +
        "you'll get notes in the shape of the template you picked.</div>";
    }
    host.parentElement.scrollTop = scroll;
  }
}

function onNoteInput() {
  state.saveState = "editing";
  $("savestate").textContent = "Unsaved";
  clearTimeout(state.saveTimer);
  // Long enough that a normal typing burst is one request, short enough that
  // stepping away from the keyboard leaves the notes on disk.
  state.saveTimer = setTimeout(saveNotes, 900);
}

async function saveNotes() {
  const box = $("notepad");
  if (!box || !state.selected) return;
  const notes = box.value;
  state.saveState = "saving";
  $("savestate").textContent = "Saving…";
  try {
    await api(`/api/meetings/${state.selected}/notes`, {
      method: "PUT", body: JSON.stringify({ notes }),
    });
    if (state.pad) state.pad.notes = notes;
    state.saveState = "saved";
  } catch (error) {
    state.saveState = "error";
    noteError(error.message);
  }
  const label = $("savestate");
  if (label) label.textContent = state.saveState === "saved" ? "Saved" : "Not saved";
}

/** Persist immediately - used when leaving the notepad. */
function flushNotes() {
  if (state.saveState === "editing") { clearTimeout(state.saveTimer); saveNotes(); }
}

function noteError(message) {
  const box = $("note-error");
  if (!box) { showError(message); return; }
  box.textContent = message;
  box.hidden = !message;
}

async function runEnhance() {
  if (state.enhancing || !state.selected) return;
  noteError("");
  flushNotes();
  state.enhancing = true;
  state.sig.enhanced = "";
  renderNotes(false);
  try {
    const template = $("template").value;
    // The autosave above may still be in flight; the server reads notes.md,
    // so send the current text along by saving synchronously first.
    await api(`/api/meetings/${state.selected}/notes`, {
      method: "PUT", body: JSON.stringify({ notes: $("notepad").value }),
    });
    const result = await api(`/api/meetings/${state.selected}/enhance`, {
      method: "POST", body: JSON.stringify({ template }),
    });
    if (state.pad) { state.pad.enhanced = result.enhanced; state.pad.template = result.template; }
    state.sig.list = "";     // the sidebar shows an "enhanced" dot
  } catch (error) {
    noteError(error.message);
  } finally {
    state.enhancing = false;
    state.sig.enhanced = "";
    renderNotes(false);
  }
}

/* ----------------------------------------------------------- transcript */

function renderTranscript(rebuild) {
  const pane = $("pane");
  if (!pane) return;
  const lines = state.detail?.transcript || [];
  const signature = `${lines.length}:${lines.length ? lines[lines.length - 1].text.length : 0}`;
  if (!rebuild && signature === state.sig.transcript) return;
  state.sig.transcript = signature;

  if (!lines.length) {
    pane.innerHTML =
      '<div class="placeholder">Nothing transcribed yet.<br>' +
      "Lines appear here a few seconds after somebody speaks.</div>";
    return;
  }
  const atBottom = pane.scrollHeight - pane.scrollTop - pane.clientHeight < 80;
  pane.innerHTML =
    '<div class="doc" style="max-width:840px">' +
    lines.map((line) =>
      '<div class="live-line">' +
        `<span class="t">${esc(mmss(line.start))}</span>` +
        `<span class="w">${esc(line.speaker)}</span>` +
        `<span>${esc(line.text)}</span>` +
      "</div>"
    ).join("") +
    "</div>";
  // Follow a live meeting, but do not yank the page from under someone who
  // has scrolled up to re-read something.
  if (atBottom) pane.scrollTop = pane.scrollHeight;
}

/* ------------------------------------------------------------------ ask */

const SUGGESTIONS = [
  "What did I miss?",
  "What was decided?",
  "List every action item and who owns it",
  "What questions were left unanswered?",
];

function renderAsk(rebuild) {
  const pane = $("pane");
  if (!pane) return;
  const turns = state.pad?.chat || [];
  const signature = `${turns.length}:${state.asking}`;
  if (!rebuild && signature === state.sig.chat) return;
  state.sig.chat = signature;

  const draft = $("ask-input")?.value || "";
  pane.innerHTML =
    '<div class="askwrap">' +
      '<div class="askbar">' +
        '<input type="text" id="ask-input" class="grow" placeholder="Ask anything about this meeting…" autocomplete="off">' +
        `<button class="btn" id="ask-go"${state.asking ? " disabled" : ""}>` +
        (state.asking ? '<span class="spin"></span> Thinking' : "Ask") + "</button>" +
      "</div>" +
      '<div class="err" id="ask-error" hidden></div>' +
      (turns.length ? "" :
        '<div class="suggest">' +
        SUGGESTIONS.map((q) => `<button data-q="${esc(q)}">${esc(q)}</button>`).join("") +
        "</div>") +
      (turns.length
        ? turns.slice().reverse().map((turn) =>
            '<div class="turn">' +
              `<div class="q">${esc(turn.question)}</div>` +
              `<div class="a doc">${renderMarkdown(turn.answer)}</div>` +
            "</div>").join("")
        : '<div class="placeholder">Answers come only from this meeting’s ' +
          "transcript and notes.<br>If it wasn’t said, Scribe will tell you so.</div>") +
      (turns.length
        ? '<button class="btn sm quiet" id="ask-clear">Clear these questions</button>' : "") +
    "</div>";

  const input = $("ask-input");
  input.value = draft;
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); runAsk(); }
  });
  $("ask-go").addEventListener("click", runAsk);
  pane.querySelectorAll(".suggest button").forEach((el) => {
    el.addEventListener("click", () => { $("ask-input").value = el.dataset.q; runAsk(); });
  });
  const clear = $("ask-clear");
  if (clear) clear.addEventListener("click", clearChat);
  if (!state.asking && rebuild) input.focus();
}

async function runAsk() {
  const input = $("ask-input");
  if (!input || state.asking) return;
  const question = input.value.trim();
  if (!question) return;
  state.asking = true;
  state.sig.chat = "";
  renderAsk(false);
  try {
    const turn = await api(`/api/meetings/${state.selected}/ask`, {
      method: "POST", body: JSON.stringify({ question }),
    });
    if (state.pad) state.pad.chat.push(turn);
    state.asking = false;
    state.sig.chat = "";
    renderAsk(false);
    const box = $("ask-input");
    if (box) box.value = "";
  } catch (error) {
    state.asking = false;
    state.sig.chat = "";
    renderAsk(false);
    const box = $("ask-error");
    if (box) { box.textContent = error.message; box.hidden = false; }
  }
}

async function clearChat() {
  try {
    await api(`/api/meetings/${state.selected}/chat`, { method: "DELETE" });
    if (state.pad) state.pad.chat = [];
    state.sig.chat = "";
    renderAsk(false);
  } catch (error) { showError(error.message); }
}

/* -------------------------------------------------------------- summary */

async function renderSummary(rebuild) {
  const pane = $("pane");
  if (!pane || !rebuild) return;
  pane.innerHTML = '<div class="placeholder"><span class="spin"></span></div>';
  try {
    const text = await api(`/api/meetings/${state.selected}/artifact/analysis.md`);
    pane.innerHTML = `<div class="doc" style="max-width:820px">${renderMarkdown(text)}</div>`;
  } catch (error) {
    pane.innerHTML = `<div class="err">${esc(error.message)}</div>`;
  }
}

/* --------------------------------------------------------------- health */

function renderHealth() {
  const host = $("health");
  const report = state.health;
  if (!report || report.can_record) { host.innerHTML = ""; return; }
  const blocker = (report.blockers || [])[0];
  if (!blocker) { host.innerHTML = ""; return; }
  host.innerHTML =
    '<div class="banner bad">' +
      `<strong>${esc(blocker.name)}:</strong> <span>${esc(blocker.detail)}</span>` +
      (blocker.fix ? `<code>${esc(blocker.fix)}</code>` : "") +
      '<span class="grow"></span>' +
      '<button class="btn sm ghost" id="recheck">Re-check</button>' +
    "</div>";
  $("recheck").addEventListener("click", async () => {
    $("recheck").disabled = true;
    try { state.health = await api("/api/health/refresh", { method: "POST" }); }
    catch (error) { showError(error.message); }
    renderHealth();
  });
}

/* ------------------------------------------------------------- commands */

async function select(jobId) {
  if (jobId === state.selected) return;
  flushNotes();
  state.selected = jobId;
  state.detail = null;
  state.pad = null;
  state.padLoadedFor = null;
  state.saveState = "";
  state.tab = "notes";
  state.sig = { list: state.sig.list, head: "", transcript: "", enhanced: "", chat: "" };
  state.sig.list = "";
  renderSidebar();
  await refreshSelected();
  renderMain();
}

async function refreshSelected() {
  if (!state.selected) return;
  try {
    const [detail, pad] = await Promise.all([
      api(`/api/meetings/${state.selected}`),
      api(`/api/meetings/${state.selected}/notepad`),
    ]);
    state.detail = detail;
    // Never overwrite notes the user is editing with the copy from disk.
    const editing = state.saveState === "editing" || state.saveState === "saving";
    state.pad = editing && state.pad ? { ...pad, notes: state.pad.notes } : pad;
  } catch (error) {
    if (!String(error.message).includes("signed out")) showError(error.message);
  }
}

async function sendBot() {
  if (state.sending) return;
  const url = $("url").value.trim();
  if (!url) { showError("Paste a Meet link first."); return; }
  state.sending = true;
  $("send").disabled = true;
  $("send").innerHTML = '<span class="spin"></span> Sending';
  showError("");
  try {
    const job = await api("/api/meetings", {
      method: "POST",
      body: JSON.stringify({
        meet_url: url,
        speaker_names_from_captions: $("opt-names").checked,
        live_captions_overlay: $("opt-overlay").checked,
        anonymise_analysis: $("opt-anon").checked,
      }),
    });
    $("url").value = "";
    await poll();
    await select(job.id);
  } catch (error) {
    showError(error.message);
  } finally {
    state.sending = false;
    $("send").disabled = false;
    $("send").textContent = "Send bot";
  }
}

async function stopMeeting(jobId) {
  state.stopping.add(jobId);
  state.sig.head = "";
  renderMain();
  try { await api(`/api/meetings/${jobId}/stop`, { method: "POST" }); }
  catch (error) { showError(error.message); state.stopping.delete(jobId); }
}

/* ----------------------------------------------------------------- poll */

async function poll() {
  try {
    const data = await api("/api/meetings");
    state.meetings = data.meetings || [];
    for (const job of state.meetings) {
      if (["finished", "failed"].includes(job.status)) state.stopping.delete(job.id);
    }
    if (!state.selected && state.meetings.length) {
      await select(state.meetings[0].id);
      return;
    }
    renderSidebar();
    if (state.selected) { await refreshSelected(); renderMain(); }
  } catch (error) {
    if (!String(error.message).includes("signed out")) console.warn(error);
  }
}

/* ---------------------------------------------------------------- admin */

async function openAdmin() {
  const root = $("modal-root");
  const close = () => { root.innerHTML = ""; };
  const draw = (users) => {
    root.innerHTML =
      '<div class="modal-bg"><div class="modal">' +
        "<h3>Accounts</h3>" +
        '<p class="md-note" style="margin:0 0 12px">Admins see every meeting. ' +
        "Members see only the ones they started.</p>" +
        users.map((u) =>
          '<div class="user-row">' +
            `<strong class="grow">${esc(u.username)}</strong>` +
            `<span class="pill">${esc(u.role)}</span>` +
            (u.username === state.me.username ? "" :
              `<button class="btn sm danger" data-del="${esc(u.username)}">Remove</button>`) +
          "</div>").join("") +
        '<div class="newuser">' +
          '<input id="nu-name" placeholder="username" autocapitalize="none" spellcheck="false">' +
          '<input id="nu-pass" type="password" placeholder="password (min 8)">' +
          '<select id="nu-role"><option value="member">Member</option>' +
          '<option value="admin">Admin</option></select>' +
          '<button class="btn sm" id="nu-add">Add</button>' +
        "</div>" +
        '<div class="err" id="admin-error" hidden></div>' +
        '<div class="row" style="margin-top:16px;justify-content:flex-end">' +
          '<button class="btn ghost sm" id="admin-close">Close</button>' +
        "</div>" +
      "</div></div>";

    $("admin-close").addEventListener("click", close);
    root.querySelector(".modal-bg").addEventListener("click", (event) => {
      if (event.target === event.currentTarget) close();
    });
    root.querySelectorAll("[data-del]").forEach((el) => {
      el.addEventListener("click", () => act(
        () => api(`/api/users/${encodeURIComponent(el.dataset.del)}`, { method: "DELETE" })));
    });
    $("nu-add").addEventListener("click", () => act(() => api("/api/users", {
      method: "POST",
      body: JSON.stringify({
        username: $("nu-name").value.trim(),
        password: $("nu-pass").value,
        role: $("nu-role").value,
      }),
    })));
  };

  const act = async (fn) => {
    try { await fn(); draw((await api("/api/users")).users); }
    catch (error) {
      const box = $("admin-error");
      if (box) { box.textContent = error.message; box.hidden = false; }
    }
  };

  try { draw((await api("/api/users")).users); }
  catch (error) { showError(error.message); }
}

/* ------------------------------------------------------------------ init */

async function init() {
  try {
    const [me, config, templates] = await Promise.all([
      api("/api/me"), api("/api/config"), api("/api/templates"),
    ]);
    state.me = me;
    state.config = config;
    state.templates = templates.templates || [];
    state.defaultTemplate = templates.default || "general";
    $("me").textContent = me.username;
    $("admin-open").hidden = me.role !== "admin";
    $("opt-names").checked = !!config.speaker_names_from_captions;
    $("opt-overlay").checked = !!config.live_captions_overlay;
    $("opt-anon").checked = !!config.anonymise_analysis;
  } catch (error) {
    if (String(error.message).includes("signed out")) return;
    showError(error.message);
  }

  try { state.health = await api("/api/health"); renderHealth(); } catch (_) { /* non-fatal */ }

  $("send").addEventListener("click", sendBot);
  $("url").addEventListener("keydown", (e) => { if (e.key === "Enter") sendBot(); });
  $("admin-open").addEventListener("click", openAdmin);
  // A refresh mid-sentence should not lose the last thing typed.
  window.addEventListener("beforeunload", () => {
    if (state.saveState !== "editing" || !state.selected) return;
    const box = $("notepad");
    if (!box) return;
    fetch(`/api/meetings/${state.selected}/notes`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ notes: box.value }),
      keepalive: true,
    });
  });

  await poll();
  renderMain();
  setInterval(poll, 2000);
}

init();
</script>
</body>
</html>
